# ✅ ASP.NET Core CI/CD with SonarCloud Integration
name: ASP.NET Core CI/CD with SonarCloud

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout source code
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2️⃣ Setup .NET SDK
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    # 3️⃣ Install SonarScanner tool
    - name: Install SonarScanner
      run: dotnet tool install --global dotnet-sonarscanner

    # 4️⃣ Restore dependencies
    - name: Restore dependencies
      run: dotnet restore CiCd_Demo.sln

    # 5️⃣ SonarCloud analysis + Build + End
    - name: Run SonarCloud Scan
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        dotnet sonarscanner begin /o:"prasadp20" /k:"Prasadp20_SonarQube_CiCd_Demo" /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
        dotnet build CiCd_Demo.sln --configuration Release
        dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

    # 6️⃣ Run tests (optional)
    - name: Run tests
      run: dotnet test CiCd_Demo.sln --no-build --configuration Release --verbosity normal
